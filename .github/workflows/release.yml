# Release: runs when a tag vX.Y.Z is pushed (made by `make release`).
# Needs repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (the updater signing key and its password); GITHUB_TOKEN is provided by Actions.
# Builds and signs the app, uploads a draft release, and only promotes it to
# published (and latest) once everything before it has passed. Before publishing it
# also uploads SHA256SUMS (over the release assets) and attests their build provenance.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout can turn an annotated tag into a lightweight one
      # (actions/checkout#290); refetch so the tag message is available.
      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: Pre-release checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release/check.mjs "${GITHUB_REF_NAME#v}" --require-secrets

      - name: Release notes
        id: notes
        run: |
          node scripts/release/notes.mjs "$GITHUB_REF_NAME" > notes.md
          delim="NOTES_$(openssl rand -hex 16)"
          {
            echo "body<<$delim"
            cat notes.md
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Install web dependencies
        run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Delilah ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # tauri-action would write draft-time (untagged-*) asset URLs; we build
          # latest.json ourselves in the next step.
          includeUpdaterJson: false

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sig="app/src-tauri/target/release/bundle/macos/Delilah.app.tar.gz.sig"
          test -f "$sig" || { echo "missing $sig; did the build sign the app?" >&2; exit 1; }
          out="$RUNNER_TEMP/latest.json"
          node scripts/release/manifest.mjs --write "$out" "$GITHUB_REF_NAME" "$sig" notes.md "$GITHUB_REPOSITORY"
          # gh falls back to draft releases by tag. tauri-action uploads the local
          # Delilah.app.tar.gz as Delilah_aarch64.app.tar.gz (ASSET in manifest.mjs).
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -qx 'Delilah_aarch64.app.tar.gz' || {
            echo "release $GITHUB_REF_NAME has no asset named Delilah_aarch64.app.tar.gz" >&2
            exit 1
          }
          gh release upload "$GITHUB_REF_NAME" "$out" --clobber

      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/dist"
          gh release download "$GITHUB_REF_NAME" -D "$RUNNER_TEMP/dist"
          for f in Delilah_aarch64.app.tar.gz latest.json; do
            test -f "$RUNNER_TEMP/dist/$f" || { echo "release $GITHUB_REF_NAME has no $f" >&2; exit 1; }
          done
          (cd "$RUNNER_TEMP/dist" && shasum -a 256 * | sort -k2) > "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" --clobber

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: '${{ runner.temp }}/dist/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
