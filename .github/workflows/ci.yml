# The same checks as "Stack & checks" in CLAUDE.md, on every PR and on main, as parallel jobs.
# The Rust jobs that build the workspace run on macOS: the daemon has macOS-only code
# (cfg(target_os = "macos")) and its tests rely on macOS behaviour (/bin/zsh, cp flags,
# process reaping), so ~10 of them fail on Linux. fmt, the web UI and the UI e2e run on Linux.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check

  clippy:
    name: Rust clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # On macOS, where the installer runs; quick, so it shares the clippy job.
      - name: Install script (shellcheck and tests)
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck scripts/install.sh scripts/test-install.sh
          scripts/test-install.sh

  test:
    name: Rust tests (${{ matrix.shard }}/3)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The shards build the same thing: one cache for all of them.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-test
      - uses: taiki-e/install-action@nextest
      # The suite is CPU-bound (git subprocesses) and saturates one 3-core macOS runner, so it is
      # split in three. The crates have no doc tests, so `cargo test --doc` is not needed.
      - run: cargo nextest run --workspace --no-fail-fast --partition count:${{ matrix.shard }}/3

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  e2e-api:
    name: E2E API/CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/e2e.sh api

  e2e-ui:
    name: E2E UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The runner image already has Chrome's system libraries, so no `--with-deps` (its apt
      # step alone took 2-5 min); e2e.sh downloads Chromium unless this cache has it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - run: npm --prefix app ci
      - run: scripts/e2e.sh ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
