# The same checks as "Stack & checks" in CLAUDE.md, on every PR and on main, as parallel jobs.
# Only clippy runs on macOS, so the macOS-only code (the keychain, cfg(target_os = "macos")) is
# still linted; fmt, tests and the web UI run on Linux, which is faster and has more cores.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check

  clippy:
    name: Rust clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The daemon runs previews and agents through /bin/zsh, which Ubuntu does not ship.
      - run: sudo apt-get install -y zsh
      # nextest runs every test binary at once (cargo test runs them one after another);
      # the crates have no doc tests, so `cargo test --doc` is not needed.
      - run: cargo nextest run --workspace --no-fail-fast

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  e2e-api:
    name: E2E API/CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - run: sudo apt-get install -y zsh
      - run: scripts/e2e.sh api

  e2e-ui:
    name: E2E UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - run: npx --prefix app playwright install --with-deps chromium
      - run: scripts/e2e.sh ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
