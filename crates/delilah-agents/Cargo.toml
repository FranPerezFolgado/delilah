[package]
name = "delilah-agents"
description = "Agent adapters (Claude Code first): launch, resume and status detection."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
delilah-core.workspace = true
portable-pty = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
