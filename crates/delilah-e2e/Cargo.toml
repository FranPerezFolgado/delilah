[package]
name = "delilah-e2e"
description = "End-to-end test harness and fake Claude Code for Delilah"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
e2e = []

[dependencies]
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
delilah-integrations = { path = "../delilah-integrations" }
delilah-agents = { path = "../delilah-agents" }

[[test]]
name = "fake_claude"
required-features = ["e2e"]

[[test]]
name = "projects"
required-features = ["e2e"]

[[test]]
name = "tasks"
required-features = ["e2e"]

[[test]]
name = "states"
required-features = ["e2e"]

[[test]]
name = "prs"
required-features = ["e2e"]

[[test]]
name = "jira"
required-features = ["e2e"]

[[test]]
name = "conversation"
required-features = ["e2e"]

[[test]]
name = "e2e_env_bin"
required-features = ["e2e"]

[[test]]
name = "real_claude"
required-features = ["e2e"]

[[test]]
name = "ui_v2"
required-features = ["e2e"]

[[test]]
name = "autopilot"
required-features = ["e2e"]

[[test]]
name = "chat_permissions"
required-features = ["e2e"]

[[test]]
name = "autofix"
required-features = ["e2e"]

[[test]]
name = "builtin_start"
required-features = ["e2e"]
