[package]
name = "delilah-daemon"
description = "The always-running process: scheduler, hook server and API."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "delilahd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
chrono.workspace = true
delilah-agents.workspace = true
delilah-core.workspace = true
delilah-git.workspace = true
serde.workspace = true
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
portable-pty = "0.9"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
