# git-cliff config: generates CHANGELOG.md from Conventional Commits.
# `git cliff -o CHANGELOG.md` (all tags) or `git cliff --tag vX.Y.Z -o CHANGELOG.md`
# (scripts/bump-version.sh does the latter).

[changelog]
header = "# Changelog\n\nAll notable changes to Delilah. Generated by git-cliff from Conventional Commits.\n\n"
body = """
{%- set repo = "https://github.com/FranPerezFolgado/delilah" -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% if version and previous.version %}
[Full changes]({{ repo }}/compare/{{ previous.version }}...{{ version }})
{% elif version %}
[Release]({{ repo }}/releases/tag/{{ version }})
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
topo_order = false
commit_parsers = [
  { message = "^chore: bump version", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^Merge", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Docs" },
  { message = ".*", group = "Other" },
]
