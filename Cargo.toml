[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop shell builds on its own (it needs the web UI built first).
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FranPerezFolgado/delilah"

[workspace.dependencies]
delilah-agents = { path = "crates/delilah-agents" }
delilah-core = { path = "crates/delilah-core" }
delilah-git = { path = "crates/delilah-git" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
