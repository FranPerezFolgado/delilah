[package]
name = "delilah-app"
description = "Delilah desktop app: a window around the web UI. All data goes through the daemon's API."
version = "1.1.2"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
