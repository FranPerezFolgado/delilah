[package]
name = "delilah-app"
description = "Delilah desktop app: a window around the web UI. All data goes through the daemon's API."
version = "0.2.0"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
